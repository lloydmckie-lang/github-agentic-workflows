name: Build React App in Subfolder

on:
  push:
    branches: 
    - "main"
    - feature/ui-builder
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. Set working directory for all steps in this job
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json # 2. Cache specific to subdir

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Upload artifact to use in later jobs (e.g., deployment)
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src/ui/dist' 